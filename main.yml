name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: your-dockerhub-username/simplebloggerapp-backend
  AWS_REGION: us-east-1 # ou sua região AWS preferida

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean install -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }},${{ env.DOCKER_IMAGE_NAME }}:latest

            sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-push # Depende da imagem ser construída
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} # Escaneia a imagem recém-construída
          args: --file=Dockerfile --severity-threshold=high # Exemplo: apenas vulnerabilidades de alta severidade
      
      - name: Run Snyk Code Scan
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium # Exemplo: apenas vulnerabilidades de média ou alta severidade
