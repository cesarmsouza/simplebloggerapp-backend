name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: your-dockerhub-username/simplebloggerapp-backend
  AWS_REGION: us-east-1 # ou sua região AWS preferida

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean install -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }},${{ env.DOCKER_IMAGE_NAME }}:latest

            sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-push # Depende da imagem ser construída
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} # Escaneia a imagem recém-construída
          args: --file=Dockerfile --severity-threshold=high # Exemplo: apenas vulnerabilidades de alta severidade
      
      - name: Run Snyk Code Scan
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium # Exemplo: apenas vulnerabilidades de média ou alta severidade
            sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run OWASP Dependency-Check
        # Usaremos um container Docker para o Dependency-Check
        # para evitar a instalação manual de Java e do próprio DC.
        run: |
          docker run --rm \
            -v $(pwd):/src \
            owasp/dependency-check:latest \
            --scan /src \
            --format HTML \
            --project "simplebloggerapp-backend" \
            --out /src/dependency-check-report.html
      
      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: dependency-check-report.html
  dast-scan:
    runs-on: ubuntu-latest
    needs: build-and-push # Precisa da imagem construída para rodar
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Start Application for DAST
        run: |
          docker run -d --name simpleblogger-app -p 8080:8080 ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          # Esperar a aplicação iniciar. Ajuste o tempo conforme necessário.
          sleep 30
        
      - name: Run OWASP ZAP Baseline Scan
        run: |
          # Acessa o ZAP docker image e roda um scan baseline contra a aplicação rodando
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            owasp/zap2docker-stable zap-baseline.py \
            -t http://host.docker.internal:8080 \
            -I -r zap-baseline-report.html # -I para ignorar erros, -r para relatório HTML
        env:
          # Para que o container ZAP possa acessar a aplicação rodando no host Docker
          # Em alguns ambientes, pode ser necessário ajustar para --network=host ou IP do host
          # No GitHub Actions, 'host.docker.internal' geralmente funciona
          ZAP_TARGET: http://host.docker.internal:8080
          
      - name: Upload ZAP DAST Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-dast-report
          path: zap-baseline-report.html

      - name: Stop Application
        if: always() # Garante que o container seja parado mesmo que o DAST falhe
        run: docker stop simpleblogger-app && docker rm simpleblogger-app
